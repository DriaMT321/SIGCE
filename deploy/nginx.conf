# Redirección de HTTP a HTTPS
server {
    listen 80;
    server_name sigce.lat www.sigce.lat api.sigce.lat sigce.sigce.lat;
    return 301 https://$host$request_uri;
}
# Frontend Web (React / Vite)
server {
    listen 443 ssl http2;
    server_name sigce.lat www.sigce.lat sigce.sigce.lat;
    ssl_certificate /etc/ssl/cloudflare/sigce-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sigce-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/sigce-web/dist;
    index index.html;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform, immutable";
    }

    location ~* \.(?:jpg|jpeg|png|gif|ico|webp|svg|woff2?|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }
}
# Backend API (NestJS + WebSockets)
server {
    listen 443 ssl http2;
    server_name api.sigce.lat;
    ssl_certificate /etc/ssl/cloudflare/sigce-origin.pem;
    ssl_certificate_key /etc/ssl/cloudflare/sigce-origin.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 50M;
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}

