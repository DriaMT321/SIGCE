name: mobile_app
description: "Aplicación móvil para familias, estudiantes y docentes - Colegio Comunidad Cristiana"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.13.0 <4.0.0'
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  dio: ^5.8.0+1
  go_router: ^14.8.1
  flutter_secure_storage: ^9.2.4
  flutter_local_notifications: ^18.0.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo-sf.png
    - assets/brand/logo-colegio-full.jpg
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope-Variable.ttf
